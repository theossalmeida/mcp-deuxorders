app = "deuxorders-mcp"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  INVOKTA_HTTP_HOST = "0.0.0.0"
  INVOKTA_HTTP_PORT = "3000"
  INVOKTA_HTTP_ALLOWED_HOSTS = "deuxorders-mcp.fly.dev"
  BACKEND_URL = "https://deux-erp.deuxcerie.com.br/api/v1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
